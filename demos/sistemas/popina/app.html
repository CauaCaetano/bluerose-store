<style>
/* abertura: aparece na hora, com a cor do template e o logo do restaurante, e some quando a tela está pronta */
#abertura{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;color:var(--ab-txt,#3B2A22);transition:opacity .28s ease,visibility .28s;
  background:radial-gradient(circle at 50% 44%,color-mix(in srgb,var(--ab-cor,#B4532F) 22%,transparent),transparent 42%),var(--ab-fundo,#F3E7CF)}
#abertura .ab{display:grid;justify-items:center;gap:16px;font:700 24px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.01em;text-align:center;padding:0 24px;animation:ab-entra .35s ease-out both}
#abertura img{width:120px;height:120px;object-fit:contain;border-radius:50%;background:#fff;padding:10px;box-shadow:0 0 0 4px var(--ab-cor,#B4532F),0 0 34px color-mix(in srgb,var(--ab-cor,#B4532F) 55%,transparent),0 16px 34px -14px rgba(0,0,0,.45);animation:ab-pulso 1.6s ease-in-out infinite}
#abertura small{font-weight:500;font-size:14px;opacity:.75;margin-top:-8px}
#abertura .ab-barra{width:180px;height:5px;border-radius:5px;background:color-mix(in srgb,var(--ab-cor,#B4532F) 22%,transparent);overflow:hidden}
@keyframes ab-entra{from{opacity:0;transform:translateY(8px)}}
#abertura .ab-barra i{display:block;width:40%;height:100%;border-radius:4px;background:var(--ab-cor,#B4532F);animation:ab-corre 1s ease-in-out infinite}
body.pronto #abertura{opacity:0;visibility:hidden;pointer-events:none}
@keyframes ab-corre{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
@keyframes ab-pulso{50%{transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){#abertura img,#abertura .ab-barra i{animation:none}#abertura .ab-barra i{width:100%}}
</style>
<script>
/* só o CSS do template em uso é baixado; os outros entram na hora se o dono trocar em Gestão › Aparência */
(function () {
  var V = window.POPINA_TPLV = {luxo:7,realeza:10,japones:4,italiano:3,churrascaria:3,mexicano:3,pizzaria:3,hamburgueria:3,pub:3,chines:3,balada:4,basico:3,cafeteria:3}, C = window.POPINA_TPLC = {basico:['#F5F6F8','','#1F2328'],taverna:['#F3E7CF','#B4532F','#3B2A22'],luxo:['#FBF8F1','#B8914A','#3A2E22'],realeza:['#14213D','#C9A35A','#F5E9CC'],japones:['#F5EEDF','#B3212B','#1E1A17'],italiano:['#F6EFE1','#B8261E','#2B2420'],churrascaria:['#F1E4CC','#A8231A','#2E2118'],mexicano:['#F6EBD6','#B51F1F','#2A1F1A'],pizzaria:['#F7EEDD','#B8231C','#2A2420'],hamburgueria:['#F6EEDC','#C8201E','#1E1A17'],pub:['#F3E9D6','#1F4A2E','#2A2018'],chines:['#F7EEDB','#B0141B','#2A1A16'],balada:['#120C2A','#FF2FB9','#F2EEFF'],cafeteria:['#F6EEDF','#9E3A26','#3A2618']}, d = null;
  try { d = JSON.parse(localStorage.getItem('popina-v1') || 'null'); } catch (e) {}
  var L = (d && d.config && d.config.loja) || {}, tp = C[L.template] ? L.template : (d ? 'basico' : 'taverna');
  window.POPINA_TPL = tp; window.POPINA_LOJA = { nome: (d && d.config && d.config.nome) || 'Popina', logo: L.logo || '', cor: L.cor || '' };
  /* ícone e cor da barra do celular no estilo do template (o Taverna usa os originais) */
  window.POPINA_ICONE = function (t) { var TM = {basico:'#B4532F',luxo:'#B8914A',realeza:'#14213D',japones:'#B3212B',italiano:'#B8261E',churrascaria:'#A8231A',mexicano:'#B51F1F',pizzaria:'#B8231C',hamburgueria:'#C8201E',pub:'#1F4A2E',chines:'#B0141B',balada:'#120C2A',cafeteria:'#3A2618'}; if (!TM[t]) return; var g = function (i) { return document.getElementById(i); };
    g('l-icone').href = 'img/icones/' + t + '-192.png?v=1'; g('l-apple').href = 'img/icones/' + t + '-apple.png?v=1';
    g('l-manifest').href = 'manifest-' + t + '.webmanifest?v=1'; g('m-tema').content = TM[t]; };
  window.POPINA_ICONE(tp);
  if (V[tp]) document.write('<link rel="stylesheet" href="tpl-' + tp + '.css?v=' + V[tp] + '" data-tpl="' + tp + '">');
})();
</script>

<div id="abertura" aria-hidden="true"><div class="ab"><img id="ab-logo" src="simbolo.png?v=1" alt="" width="88" height="88"><span id="ab-nome">Popina</span><small>Abrindo o sistema…</small><span class="ab-barra"><i></i></span></div></div>
<script>
(function () {
  var c = window.POPINA_TPLC[window.POPINA_TPL] || [], L = window.POPINA_LOJA, r = document.documentElement.style, cor = /^#[0-9a-f]{6}$/i.test(L.cor) ? L.cor : '';
  r.setProperty('--ab-fundo', c[0] || '#F3E7CF'); r.setProperty('--ab-txt', c[2] || '#3B2A22'); r.setProperty('--ab-cor', (window.POPINA_TPL === 'basico' && cor) || c[1] || cor || '#B4532F');
  /* logo do restaurante; sem ele, o logo do Popina no estilo do template (o Taverna usa o original) */
  document.getElementById('ab-logo').src = L.logo || (window.POPINA_TPL === 'taverna' ? 'simbolo.png?v=1' : 'img/logo-' + window.POPINA_TPL + '.webp?v=1');
  document.getElementById('ab-nome').textContent = L.nome;
  setTimeout(function () { document.body.classList.add('pronto'); }, 8000); /* nunca fica presa */
})();
</script>

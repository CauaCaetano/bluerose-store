<script type="module">
  // moldura do computador: troca a página pelo celular com o app dentro
  if (window.atriaMoldura) {
    const { qrSVG } = await import('../base/qr.js');
    const tpl = document.getElementById('moldura').content.cloneNode(true);
    document.body.innerHTML = ''; document.body.appendChild(tpl);
    const u = new URL(location.href); u.searchParams.set('celular', '1');
    document.querySelector('.celular iframe').src = u.pathname + u.search + u.hash;
    const pub = new URL(location.href); pub.search = ''; pub.hash = '';
    document.querySelector('[data-qr]').innerHTML = qrSVG(pub.href, 132, '#2E333B');
    document.title = 'Atria · feito para o celular';
  }
</script>

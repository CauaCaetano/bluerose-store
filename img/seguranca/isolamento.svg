<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" role="img" aria-labelledby="iso-t iso-d" font-family="Geist, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <title id="iso-t">Como uma empresa fica separada da outra no banco de dados</title>
  <desc id="iso-d">1. A pessoa da Empresa A entra com o próprio e-mail e senha. 2. A cada leitura e gravação, as regras do banco (RLS) conferem se aquele login faz parte da empresa; a regra está ligada em todas as tabelas. 3. Empresa A: sim, lê e grava só os dados dela. Empresa B: não, nada volta e nada é gravado.</desc>
  <defs>
    <marker id="iso-seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2f4c8a"/>
    </marker>
    <marker id="iso-seta-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6b6f78"/>
    </marker>
  </defs>
  <rect width="780" height="400" fill="#f4ebdd"/>

  <!-- 1 · entrar -->
  <rect x="8" y="120" width="196" height="160" rx="12" fill="#fbf6ee" stroke="#d9cbb3" stroke-width="1.5"/>
  <text x="26" y="154" font-size="13" font-weight="600" letter-spacing="1.2" fill="#2f4c8a">1 · ENTRAR</text>
  <text x="26" y="188" font-size="19" font-weight="600" fill="#101b36">Pessoa da</text>
  <text x="26" y="212" font-size="19" font-weight="600" fill="#101b36">Empresa A</text>
  <text x="26" y="244" font-size="15" fill="#464c58">Entra com o próprio</text>
  <text x="26" y="264" font-size="15" fill="#464c58">e-mail e senha</text>

  <line x1="206" y1="200" x2="246" y2="200" stroke="#2f4c8a" stroke-width="2.5" marker-end="url(#iso-seta)"/>

  <!-- 2 · regras no banco -->
  <rect x="252" y="70" width="266" height="260" rx="12" fill="#101b36"/>
  <text x="272" y="106" font-size="13" font-weight="600" letter-spacing="1" fill="#9fb4dc">2 · REGRAS NO BANCO (RLS)</text>
  <text x="272" y="144" font-size="16" fill="#d9d4c8">A cada leitura e gravação,</text>
  <text x="272" y="166" font-size="16" fill="#d9d4c8">o banco confere:</text>
  <text x="272" y="206" font-size="20" font-weight="600" fill="#f4ebdd">Este login faz parte</text>
  <text x="272" y="232" font-size="20" font-weight="600" fill="#f4ebdd">desta empresa?</text>
  <text x="272" y="280" font-size="14" fill="#c5cddc">Regra ligada em todas as tabelas,</text>
  <text x="272" y="300" font-size="14" fill="#c5cddc">no banco e não só na tela.</text>

  <line x1="520" y1="160" x2="556" y2="122" stroke="#2f4c8a" stroke-width="2.5" marker-end="url(#iso-seta)"/>
  <line x1="520" y1="240" x2="556" y2="278" stroke="#6b6f78" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#iso-seta-c)"/>

  <!-- 3 · empresa A -->
  <rect x="562" y="44" width="210" height="146" rx="12" fill="#fbf6ee" stroke="#2f4c8a" stroke-width="2"/>
  <text x="580" y="76" font-size="13" font-weight="600" letter-spacing="1.2" fill="#2f4c8a">3 · EMPRESA A</text>
  <circle cx="592" cy="110" r="12" fill="#2f4c8a"/>
  <path d="M586 110l4.5 4.5 8-9" fill="none" stroke="#fbf6ee" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="612" y="117" font-size="19" font-weight="600" fill="#101b36">Sim: lê e grava</text>
  <text x="580" y="152" font-size="15" fill="#464c58">Só os dados desta</text>
  <text x="580" y="172" font-size="15" fill="#464c58">empresa aparecem.</text>

  <!-- empresa B -->
  <rect x="562" y="210" width="210" height="146" rx="12" fill="#f4ebdd" stroke="#8a8f99" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="580" y="242" font-size="13" font-weight="600" letter-spacing="1.2" fill="#464c58">EMPRESA B</text>
  <circle cx="592" cy="276" r="12" fill="none" stroke="#464c58" stroke-width="2"/>
  <path d="M587.5 271.5l9 9M596.5 271.5l-9 9" stroke="#464c58" stroke-width="2.2" stroke-linecap="round"/>
  <text x="612" y="283" font-size="19" font-weight="600" fill="#101b36">Não: nada volta</text>
  <text x="580" y="318" font-size="15" fill="#464c58">Nada é lido nem</text>
  <text x="580" y="338" font-size="15" fill="#464c58">gravado de lá.</text>
</svg>

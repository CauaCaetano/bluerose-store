<body>
<a class="pular" href="#tela">Ir para o conteúdo</a>
<div class="casca">
  <aside class="lateral" aria-label="Navegação principal">
    <a class="marca" href="#inicio" id="marca" aria-label="Anshur, todas as áreas"></a>
    <button class="area-troca area-troca-lateral" id="area-troca" type="button" aria-haspopup="menu" aria-expanded="false">Áreas</button>
    <nav class="menu" id="menu" aria-label="Menu da área">
      <span class="menu-indicador" aria-hidden="true"></span>
    </nav>
    <p class="lateral-rodape">Dados demonstrativos de uma revenda fictícia.</p>
  </aside>
  <div class="principal">
    <header class="cabecalho">
      <a class="marca marca-movel" href="#inicio" id="marca-movel" aria-label="Anshur, todas as áreas"></a>
      <button class="area-troca area-troca-cab" type="button" aria-haspopup="menu" aria-expanded="false">Áreas</button>
      <div class="cab-info"><b id="revenda"></b><span id="refdata"></span></div>
      <select class="loja-sel" id="loja-sel" aria-label="Loja"></select>
      <span class="selo-demo">Dados demonstrativos</span>
      <button class="sino busca-btn" type="button" id="busca-btn" aria-label="Buscar (Ctrl+K)"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4"/></svg><span class="kbd">Ctrl K</span></button>
      <button class="sino" type="button" id="instalar-btn" aria-label="Instalar o app" title="Instalar o Anshur"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></button>
      <button class="sino" type="button" id="sino" aria-label="Alertas"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 20a2 2 0 0 0 4 0"/></svg><b id="sino-n" hidden></b></button>
      <a class="btn btn-ouro cab-nova" href="#avaliar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Nova avaliação</span></a>
      <div class="perfil">
        <button class="avatar" id="perfil" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Perfil e opções">SA</button>
        <div class="perfil-menu" id="perfil-menu" role="menu" hidden>
          <p><b>Seu Antônio</b><span>Proprietário · Mogiana Máquinas</span></p>
          <button type="button" role="menuitem" id="restaurar">Restaurar dados demonstrativos</button>
        </div>
      </div>
    </header>
    <main id="tela" tabindex="-1"></main>
  </div>
</div>
<div id="camada"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="instalar.js?v=18"></script>
<script src="areas.js?v=18"></script>
<script src="dados.js?v=18"></script>
